<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZYVRO.WEAR — Online Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-50 text-neutral-900 min-h-screen font-sans antialiased">

  <script>
    const CONFIG = {
      SHOP_NAME: "ZYVRO.WEAR",
      SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyX7AEAfPXxwgCcjcEmhU23gGm3hKRcaNtRCwfrxlz4LnsIbXMErHPCIgWhNyriYb0I/exec",
      CARD_NUMBER: "9860 1606 0235 1506",
      CARD_HOLDER: "Abdurasulov Abduxalim",
      CLICK_LINK: "https://my.click.uz/clickp2p/633C59EABE795B25B3AD53CAC08EB9CE58EDB8FAD6ED0569DAA4C815BFE5EEE2"
    };
  </script>

  <!-- Navbar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-neutral-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-black"></span>
        <span id="brandTitle" class="font-black text-xl tracking-widest uppercase">ZYVRO.WEAR</span>
      </div>

      <button onclick="toggleCart(true)" class="inline-flex items-center gap-2.5 bg-black text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-neutral-800 transition cursor-pointer">
        <span>Savatcha</span>
        <span id="cartBadge" class="bg-white text-black text-xs font-bold px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- Hero banner -->
  <section class="bg-neutral-900 text-white py-10 px-4">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <p class="text-xs uppercase tracking-widest text-neutral-400 mb-1">Yangi kolleksiya</p>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Kiyim, Krasovka va Aksessuarlar</h1>
      </div>
      <div class="text-xs text-neutral-300 bg-white/10 px-4 py-2.5 rounded-xl border border-white/10">
        100% oldindan to‘lov • Tezkor yetkazib berish
      </div>
    </div>
  </section>

  <!-- Main Catalog -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Qidiruv va Kategoriyalar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div id="categories" class="flex flex-wrap gap-2"></div>
      <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Mahsulot qidirish..." class="w-full sm:w-64 bg-white border border-neutral-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-black" />
    </div>

    <div id="loading" class="text-center py-20 text-neutral-500 text-sm">Mahsulotlar yuklanmoqda...</div>
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Savatcha & Zakaz Modal -->
  <div id="cartModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
      <div class="px-6 py-4 border-b border-neutral-200 flex items-center justify-between">
        <h2 class="font-bold text-lg">Savatcha va 100% To‘lov</h2>
        <button onclick="toggleCart(false)" class="text-neutral-400 hover:text-black text-2xl leading-none">&times;</button>
      </div>

      <div class="p-6 overflow-y-auto space-y-6">
        <div id="cartItems" class="space-y-3"></div>

        <div class="flex items-center justify-between pt-3 border-t border-neutral-200 font-bold text-base">
          <span>Jami to‘lov (100%):</span>
          <span id="cartTotal" class="text-black text-lg">0 so‘m</span>
        </div>

        <form id="orderForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-neutral-500 mb-1">Ism va familiya *</label>
            <input type="text" id="custName" required placeholder="Masalan: Jasur Alimov" class="w-full border border-neutral-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-black" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase text-neutral-500 mb-1">Telefon raqam *</label>
              <input type="tel" id="custPhone" required placeholder="+998 90 123 45 67" class="w-full border border-neutral-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-black" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-neutral-500 mb-1">Telegram @username *</label>
              <input type="text" id="custTg" required placeholder="@username" class="w-full border border-neutral-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-black" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase text-neutral-500 mb-1">Mahsulotni qayerdan olasiz / Manzil *</label>
            <select id="pickupType" class="w-full border border-neutral-300 rounded-xl px-3.5 py-2.5 text-sm mb-2 bg-white focus:outline-none focus:border-black">
              <option value="Toshkent — Kuryer orqali">Toshkent — Kuryer orqali</option>
              <option value="Viloyatlarga — BTS / Fargo pochta">Viloyatlarga — BTS / Fargo pochta</option>
              <option value="O‘zim kelib olib ketaman (Pickup)">O‘zim kelib olib ketaman (Pickup)</option>
            </select>
            <input type="text" id="custAddress" required placeholder="Shahar, tuman, mo‘ljal yoki olib ketish joyi" class="w-full border border-neutral-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-black" />
          </div>

          <!-- To'lov kartasi -->
          <div class="bg-neutral-100 border border-neutral-200 rounded-xl p-4 space-y-2.5">
            <div class="text-xs font-bold text-neutral-800">100% oldindan to‘lov uchun karta:</div>
            <div class="flex items-center justify-between bg-white px-3.5 py-2.5 rounded-lg border border-neutral-300">
              <div>
                <div id="cardDisplay" class="font-mono font-bold text-sm">9860 1606 0235 1506</div>
                <div id="holderDisplay" class="text-[11px] text-neutral-500 uppercase">Abdurasulov Abduxalim</div>
              </div>
              <button type="button" onclick="copyCard()" class="text-xs bg-black text-white px-3 py-1.5 rounded-lg hover:bg-neutral-800 font-medium cursor-pointer">Nusxalash</button>
            </div>
            <div class="pt-1">
              <a id="clickBtn" target="_blank" class="block w-full text-center bg-blue-600 text-white text-xs font-bold py-2.5 rounded-lg hover:bg-blue-700 transition">Click orqali to‘lash</a>
            </div>
          </div>

          <!-- To'lov cheki -->
          <div>
            <label class="block text-xs font-bold uppercase text-neutral-500 mb-1">To‘lov cheki (skrinshot) *</label>
            <input type="file" id="checkFile" accept="image/*" required class="w-full text-xs text-neutral-600 file:mr-3 file:py-2 file:px-3.5 file:rounded-lg file:border-0 file:bg-black file:text-white hover:file:bg-neutral-800 cursor-pointer" />
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-black text-white font-bold py-3.5 rounded-xl hover:bg-neutral-800 transition cursor-pointer">
            Zakazni tasdiqlash
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("brandTitle").textContent = CONFIG.SHOP_NAME;
    document.getElementById("cardDisplay").textContent = CONFIG.CARD_NUMBER;
    document.getElementById("holderDisplay").textContent = CONFIG.CARD_HOLDER;
    document.getElementById("clickBtn").href = CONFIG.CLICK_LINK;

    let products = [];
    let activeCategory = "Barchasi";
    let cart = JSON.parse(localStorage.getItem("zyvro_cart") || "[]");

    async function loadProducts() {
      try {
        const res = await fetch(CONFIG.SCRIPT_URL);
        const data = await res.json();
        products = data.products || [];
        document.getElementById("loading").classList.add("hidden");
        renderCategories();
        renderProducts();
        updateCartUI();
      } catch (e) {
        document.getElementById("loading").textContent = "Mahsulotlar yuklanmadi. Google Sheets'ga kamida 1 ta mahsulot qo‘shilganini tekshiring.";
      }
    }

    function renderCategories() {
      const cats = ["Barchasi", ...new Set(products.map(p => p.kategoriya).filter(Boolean))];
      const box = document.getElementById("categories");
      box.innerHTML = cats.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wide transition cursor-pointer ${
          activeCategory === cat ? "bg-black text-white" : "bg-white text-neutral-700 border border-neutral-300 hover:border-black"
        }">${cat}</button>
      `).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      let list = activeCategory === "Barchasi" ? products : products.filter(p => p.kategoriya === activeCategory);
      if (q) {
        list = list.filter(p => String(p.nomi).toLowerCase().includes(q) || String(p.tavsif).toLowerCase().includes(q));
      }

      const grid = document.getElementById("productsGrid");
      if (!list.length) {
        grid.innerHTML = `<p class="col-span-full text-center text-neutral-500 py-14 text-sm">Hozircha mahsulot topilmadi.</p>`;
        return;
      }

      grid.innerHTML = list.map(p => `
        <div class="bg-white rounded-2xl border border-neutral-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          <div>
            <div class="aspect-square bg-neutral-100 overflow-hidden">
              <img src="${p.rasm || 'https://placehold.co/600x600?text=ZYVRO.WEAR'}" alt="${p.nomi}" class="w-full h-full object-cover hover:scale-105 transition duration-300" />
            </div>
            <div class="p-4">
              <span class="text-[10px] font-bold uppercase tracking-widest text-neutral-400">${p.kategoriya || "Wear"}</span>
              <h3 class="font-bold text-base mt-0.5">${p.nomi}</h3>
              <p class="text-xs text-neutral-500 mt-1 line-clamp-2">${p.tavsif || ""}</p>
            </div>
          </div>

          <div class="px-4 pb-4 pt-2 space-y-2.5">
            <div class="flex items-center gap-2">
              <select id="size-${p.id}" class="border border-neutral-300 rounded-xl px-2.5 py-2 text-xs font-semibold bg-neutral-50 focus:outline-none focus:border-black">
                <option value="S">S</option>
                <option value="M" selected>M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="40">40</option>
                <option value="41">41</option>
                <option value="42">42</option>
                <option value="43">43</option>
                <option value="44">44</option>
                <option value="Standard">Standard</option>
              </select>
              <button onclick="addToCart('${p.id}')" class="flex-1 bg-black text-white text-xs font-bold py-2.5 rounded-xl hover:bg-neutral-800 transition cursor-pointer">
                + Savatga qo‘shish
              </button>
            </div>
            <div class="font-extrabold text-base text-right">${Number(p.narxi).toLocaleString("ru-RU")} so‘m</div>
          </div>
        </div>
      `).join("");
    }

    function addToCart(id) {
      const prod = products.find(p => String(p.id) === String(id));
      if (!prod) return;
      const sizeEl = document.getElementById(`size-${id}`);
      const size = sizeEl ? sizeEl.value : "Standard";
      const key = `${prod.id}_${size}`;

      const existing = cart.find(item => item.key === key);
      if (existing) existing.qty += 1;
      else cart.push({ key, id: prod.id, nomi: prod.nomi, size, narxi: Number(prod.narxi), qty: 1 });

      saveCart();
      updateCartUI();
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      saveCart();
      updateCartUI();
    }

    function saveCart() {
      localStorage.setItem("zyvro_cart", JSON.stringify(cart));
    }

    function updateCartUI() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      const total = cart.reduce((s, i) => s + i.qty * i.narxi, 0);
      document.getElementById("cartBadge").textContent = count;
      document.getElementById("cartTotal").textContent = `${total.toLocaleString("ru-RU")} so‘m`;

      const container = document.getElementById("cartItems");
      if (!cart.length) {
        container.innerHTML = `<p class="text-sm text-neutral-500 text-center py-4">Savatchangiz bo‘sh.</p>`;
        return;
      }

      container.innerHTML = cart.map((item, idx) => `
        <div class="flex items-center justify-between bg-neutral-50 p-3 rounded-xl border border-neutral-200">
          <div>
            <div class="font-bold text-sm">${item.nomi} <span class="text-xs font-semibold text-neutral-500">[${item.size}]</span></div>
            <div class="text-xs text-neutral-600">${(item.narxi * item.qty).toLocaleString("ru-RU")} so‘m</div>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="changeQty(${idx}, -1)" class="w-7 h-7 rounded-lg bg-white border border-neutral-300 font-bold">-</button>
            <span class="text-sm font-bold w-5 text-center">${item.qty}</span>
            <button type="button" onclick="changeQty(${idx}, 1)" class="w-7 h-7 rounded-lg bg-white border border-neutral-300 font-bold">+</button>
          </div>
        </div>
      `).join("");
    }

    function toggleCart(show) {
      document.getElementById("cartModal").classList.toggle("hidden", !show);
    }

    function copyCard() {
      navigator.clipboard.writeText(CONFIG.CARD_NUMBER);
      alert("Karta raqami nusxalandi!");
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!cart.length) return alert("Avval savatchaga mahsulot qo‘shing!");

      const fileInput = document.getElementById("checkFile");
      if (!fileInput.files.length) return alert("Iltimos, to‘lov cheki skrinshotini yuklang!");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Zakaz yuborilmoqda...";

      try {
        const file = fileInput.files[0];
        const base64 = await readFileAsBase64(file);
        const total = cart.reduce((s, i) => s + i.qty * i.narxi, 0);
        const itemsText = cart.map(i => `• ${i.nomi} (${i.size}) x${i.qty} — ${(i.narxi * i.qty).toLocaleString("ru-RU")} so‘m`).join("\n");

        const payload = {
          mijoz: document.getElementById("custName").value.trim(),
          telefon: document.getElementById("custPhone").value.trim(),
          telegram: document.getElementById("custTg").value.trim(),
          manzil: `${document.getElementById("pickupType").value} — ${document.getElementById("custAddress").value.trim()}`,
          mahsulotlarText: itemsText,
          jami: total,
          chekBase64: base64,
          chekMime: file.type
        };

        const res = await fetch(CONFIG.SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === "ok") {
          alert("Zakazingiz va to‘lov cheki qabul qilindi! Tez orada Telegram orqali bog‘lanamiz.");
          cart = [];
          saveCart();
          updateCartUI();
          e.target.reset();
          toggleCart(false);
        } else {
          alert("Xatolik: " + (result.message || "Qayta urinib ko‘ring"));
        }
      } catch (err) {
        alert("Yuborishda xatolik yuz berdi. Internetni tekshiring.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Zakazni tasdiqlash";
      }
    });

    loadProducts();
  </script>
</body>
</html>
